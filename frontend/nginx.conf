server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 3m;   # event posters (the API itself caps them at 2 MB)

  # Live seat map (Server-Sent Events): a long-lived response that must not be buffered or timed out.
  location ~ ^/api/shows/\d+/seats/stream$ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Forward API calls to the Spring Boot container (same idea as the Vite dev proxy)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend rate-limits per client IP; without this every user would look like nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: any other path serves index.html
  location / {
    try_files $uri /index.html;
  }
}
