server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Spring Boot container (same idea as the Vite dev proxy)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend rate-limits per client IP; without this every user would look like nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router: any other path serves index.html
  location / {
    try_files $uri /index.html;
  }
}
