spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatrush}
    username: ${DB_USER:seatrush}
    password: ${DB_PASSWORD:seatrush}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # Redis is an accelerator: never let it stall a request
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 2MB      # event posters
      max-request-size: 3MB
server:
  forward-headers-strategy: native   # trust X-Forwarded-For from nginx so rate limits see the real client IP
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}   # used for the links in verification / password-reset emails
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiration-minutes: 60
  ticket:
    secret: ${TICKET_SECRET:${JWT_SECRET:change-me-change-me-change-me-change-me-1234}}   # signs e-ticket QR codes
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  redis:
    enabled: ${REDIS_ENABLED:true}   # false = no hold gate / cache / waiting room; rate limits fall back to in-memory
  scheduling:
    enabled: true
  booking:
    hold-minutes: ${HOLD_MINUTES:5}          # how long picked seats are reserved before payment starts
    payment-minutes: 10                      # extra time once the user is on the payment step
    max-seats: 8
    lock-strategy: ${LOCK_STRATEGY:PESSIMISTIC}   # PESSIMISTIC | OPTIMISTIC
    redis-gate: true
    sweep-interval-ms: 5000
    refund:                                  # cancelling a paid booking
      full-hours: ${REFUND_FULL_HOURS:24}        # 100% back until this many hours before the show
      partial-hours: ${REFUND_PARTIAL_HOURS:2}   # partial refund until this many hours before; no cancellation after
      partial-percent: ${REFUND_PARTIAL_PERCENT:50}
  waiting-room:
    capacity: ${WAITING_ROOM_CAPACITY:50}    # how many buyers may be picking seats for one show at the same time
    pass-minutes: 10                         # how long an admitted buyer has to hold seats
    stale-seconds: 30                        # a queued buyer who stops checking in for this long loses their place
  outbox:
    poll-interval-ms: 5000
  payment:
    provider: ${PAYMENT_PROVIDER:mock}       # mock | razorpay
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret-change-me}
    refund-interval-ms: 10000
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH:20}   # per IP: login, register, password reset
    hold-per-minute: ${RATE_LIMIT_HOLD:30}   # per user, seat holds
  mail:
    from: ${MAIL_FROM:no-reply@seatrush.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: seatrush
    distribution:
      percentiles-histogram:
        seatrush.hold: true          # lets Prometheus compute p95/p99 hold latency
        http.server.requests: true
  health:
    redis:
      enabled: false   # Redis being down degrades features, it does not make the app unhealthy
